spring:
  application:
    name: brain-health
  config:
    import: optional:configserver:http://config-service:8888

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:brain-health-consumer-group}
    producer:
      properties:
        compression.type: none

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: brain-health-service

# Kafka Topics
kafka:
  topic:
    consumer: goal.created
    producer: goal.progress.updated

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    info:
      enabled: true
  health:
    kafka:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: AI-powered medical article generation and questionnaire service with Kafka integration
    version: 0.0.1-SNAPSHOT

# External Services Configuration
external-services:
  cremesp:
    base-url: https://cremesp.org.br/pesquisar.php
    max-content-length: 8000
    timeout-seconds: 30