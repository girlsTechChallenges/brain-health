spring.application.name=brain-health

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:brain-health-consumer-group}

# Kafka Topics
kafka.topic.brain-health-request=brain-health-request
kafka.topic.brain-health-response=brain-health-response

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.kafka.enabled=false

# External Services Configuration
# Medical Article Search - CREMESP (Conselho Regional de Medicina do Estado de S?o Paulo)
external-services.cremesp.base-url=https://cremesp.org.br/pesquisar.php
external-services.cremesp.max-content-length=8000
external-services.cremesp.timeout-seconds=30
